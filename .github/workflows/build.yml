name: HELL ROWDY Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target HellRowdy_VST3

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HellRowdy-VST3-Windows-${{ github.run_number }}
          path: build/HellRowdy_artefacts/Release/VST3/

  build-mac:
    name: macOS VST3 + AU
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.13"

      - name: Build
        run: cmake --build build --config Release

      - name: Permissions + Codesign
        run: |
          # 実行権限の付与とアドホック署名
          find build -name "*.vst3" -o -name "*.component" | while read -r bundle; do
            echo "Processing $bundle..."
            if [ -d "$bundle/Contents/MacOS" ]; then
              find "$bundle/Contents/MacOS" -type f -exec chmod +x {} \;
            fi
            # アドホック署名を実行（--deep で内部バイナリも対象に）
            codesign --force --deep --sign - "$bundle"
          done

      - name: Package
        run: |
          mkdir -p out
          # スペースを含むファイル名に対応するため、引用符を適切に使用
          VST3=$(find build -name "Hell Rowdy.vst3" -type d | head -1)
          AU=$(find build -name "Hell Rowdy.component" -type d | head -1)
          
          if [ -n "$VST3" ]; then
            echo "Packaging VST3: $VST3"
            (cd "$(dirname "$VST3")" && zip -ry "../../../../out/HellRowdy-vst3.zip" "$(basename "$VST3")")
          fi
          
          if [ -n "$AU" ]; then
            echo "Packaging AU: $AU"
            (cd "$(dirname "$AU")" && zip -ry "../../../../out/HellRowdy-au.zip" "$(basename "$AU")")
          fi

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HellRowdy-Mac-${{ github.run_number }}
          path: out/
