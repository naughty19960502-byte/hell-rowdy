name: HELL ROWDY Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows VST3
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --target HellRowdy_VST3

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HellRowdy-VST3-Windows-${{ github.run_number }}
          path: build/HellRowdy_artefacts/Release/VST3/

  build-mac:
    name: macOS VST3 + AU
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.13"

      - name: Build
        run: cmake --build build --config Release

      - name: Permissions + Codesign
        run: |
          find build \( -name "*.vst3" -o -name "*.component" \) | while read b; do
            find "$b/Contents/MacOS" -type f -exec chmod +x {} \; 2>/dev/null || true
            codesign --force --deep --sign - "$b" 2>/dev/null || true
          done

      - name: Package
        run: |
          mkdir -p out
          VST3=$(find build -name "Hell Rowdy.vst3" -type d | head -1)
          AU=$(find build -name "Hell Rowdy.component" -type d | head -1)
          [ -n "$VST3" ] && (cd "$(dirname "$VST3")" && zip -ry ../../../../out/HellRowdy-vst3.zip "$(basename "$VST3")")
          [ -n "$AU" ]   && (cd "$(dirname "$AU")"   && zip -ry ../../../../out/HellRowdy-au.zip   "$(basename "$AU")")
          true

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: HellRowdy-Mac-${{ github.run_number }}
          path: out/
